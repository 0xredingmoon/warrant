# One command: docker compose up --build
#   dashboard         http://localhost:8080
#   relayer / x402    http://localhost:8787   (GET /health, /supported; POST /verify, /settle, /v1/...)
#   Ledgerline API    http://localhost:8788   (try: curl -i localhost:8788/v1/filings/ACME/10k-summary)
#   notes site        http://localhost:8789   (carries the prompt injection used in the demo)
# Needs RELAYER_PRIVATE_KEY in .env: a throwaway testnet key holding a little tQDAY for gas.
x-chain: &chain
  RPC_URL: ${RPC_URL:-https://rpc-test.qday.info}
  CHAIN_ID: "44005"
  EXPLORER_URL: ${EXPLORER_URL:-https://explorer-test.qday.info}
  FACTORY_ADDRESS: ${FACTORY_ADDRESS:-0x66687369d9C683aaaaDAe98b747b63eE7e0662E3}

services:
  relayer:
    build: { context: ., target: relayer }
    environment:
      <<: *chain
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:?set RELAYER_PRIVATE_KEY in .env (testnet key with a little tQDAY)}
      RELAYER_API_KEY: ${RELAYER_API_KEY:-}
      DATABASE_PATH: /data/relayer.db
    volumes: ["relayer-data:/data"]
    ports: ["8787:8787"]
    restart: unless-stopped

  merchant:
    build: { context: ., target: demo }
    depends_on: [relayer]
    environment:
      <<: *chain
      FACILITATOR_URL: http://relayer:8787
      FACILITATOR_API_KEY: ${RELAYER_API_KEY:-}
      MERCHANT_PAY_TO: ${MERCHANT_PAY_TO:-0xf2b01C5b12DaAe6adAa0a876065D303302F4b4Ae}
      NOTES_PUBLIC_URL: http://localhost:8789
      DATABASE_PATH: /data/ledgerline.db
    volumes: ["merchant-data:/data"]
    ports: ["8788:8788", "8789:8789"]
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    depends_on: [relayer]
    environment:
      # these are read by the browser, so they must be reachable from the host, not from inside the compose network
      RELAYER_URL: ${PUBLIC_RELAYER_URL:-http://localhost:8787}
      RPC_URL: ${RPC_URL:-https://rpc-test.qday.info}
      EXPLORER_URL: ${EXPLORER_URL:-https://explorer-test.qday.info}
      FACTORY_ADDRESS: ${FACTORY_ADDRESS:-0x66687369d9C683aaaaDAe98b747b63eE7e0662E3}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-0xD0442513fd53FA91c411939648F9edbBF2ed747d}
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  relayer-data:
  merchant-data:
