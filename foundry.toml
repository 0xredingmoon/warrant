[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Aevum runs the Shanghai EVM: no MCOPY, TSTORE/TLOAD or blob opcodes.
# Never raise this to "cancun", or contracts that pass tests will fail on chain.
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
gas_reports = ["WarrantFactory", "WarrantVault", "AgentRegistry"]
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[fmt]
line_length = 110

[lint]
# Every narrowing cast in src/ is bounded by a preceding check or by block.timestamp; see inline comments.
exclude_lints = ["unsafe-typecast"]
