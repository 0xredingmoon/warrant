# Fly.io app for the relayer:   fly launch --copy-config --no-deploy && fly secrets set RELAYER_PRIVATE_KEY=0x... && fly deploy
# (Nothing is created by this file alone.) The dashboard is static: host web/out anywhere, or use the `web` Docker target.
app = "warrant-relayer"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"   # the default (last) stage is the relayer

[env]
  PORT = "8787"
  CHAIN_ID = "44005"
  RPC_URL = "https://rpc-test.qday.info"
  FACTORY_ADDRESS = "0x66687369d9C683aaaaDAe98b747b63eE7e0662E3"
  DATABASE_PATH = "/data/relayer.db"
  TRUSTED_IP_HEADER = "fly-client-ip"

[mounts]
  source = "relayer_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
