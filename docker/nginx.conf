server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # config.js is generated at container start: never cache it
  location = /config.js { add_header Cache-Control "no-store"; }
  # hashed build assets are immutable
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri $uri.html $uri/ /index.html; }
}
